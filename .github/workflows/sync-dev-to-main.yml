name: Dev PR to main

# Promotion path: Dev → main as a PULL REQUEST, so the merge needs the
# branch rule on main (review/approval) to pass. A direct fast-forward is
# intentionally NOT attempted — with "require pull request" rulesets it is
# declined server-side. When this workflow runs it (re)opens a PR with the
# dev→main diff; the merge button stays human.

on:
  push:
    branches: [Dev]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: dev-pr
  cancel-in-progress: true

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Open (or reuse) the Dev → main pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr view --repo reizu-x/Notive --base main --head Dev >/dev/null 2>&1 && {
            echo "A Dev → main PR is already open."
            exit 0
          }
          gh pr create \
            --repo reizu-x/Notive \
            --base main --head Dev \
            --title "Dev → main: editor rework checkpoint" \
            --body "Promoting **Dev** to **main**. Review the diff, approve if a second reviewer is on file, then merge from the UI. Title/body can be edited before merging." \
            --draft=false

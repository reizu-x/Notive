name: Sync Dev to main

# Manual escape hatch only. Automatic promotion is driven from opencode via the
# `/sync-main` command, which shows the diff and asks for confirmation before
# fast-forwarding main. This workflow exists so the same sync can be triggered
# by hand from the GitHub UI (Actions -> Sync Dev to main -> Run workflow).
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-dev-to-main
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Dev
        uses: actions/checkout@v4
        with:
          ref: Dev
          fetch-depth: 0

      - name: Fast-forward main to Dev
        run: git push origin HEAD:main

name: Deploy to VPS

# Deploys main to the Notive VPS over SSH, rebuilds the app image and restarts
# the app container. Requires repository secrets:
#   NOTIVE_SSH_KEY  — private key of the actions deploy key (authorized on the VPS)
# Server state NOT managed here (must never be overwritten by deploys):
#   /opt/notive/.env        (DB password + NOTIVE_PG_DSN)
#   /opt/notive/certs/      (TLS material)
#   /opt/notive/notive.key  (E2E encryption key, if present)
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          set -e
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # NOTIVE_SSH_KEY = the private key, base64-encoded (single line, no quotes)
          # → immune to paste/multiline mangling in the GitHub secret editor
          printf '%s' "${{ secrets.NOTIVE_SSH_KEY }}" | base64 -d > ~/.ssh/notive 2>base64.err || { cat base64.err; echo "ERROR: NOTIVE_SSH_KEY is not valid base64 — run: base64 -w0 /tmp/opencode/notive-actions-deploy and paste the single line"; exit 1; }
          chmod 600 ~/.ssh/notive
          CHARS=$(wc -c < ~/.ssh/notive)
          echo "decoded key size: $CHARS bytes"
          if [ "$CHARS" -lt 200 ]; then echo "ERROR: decoded key too small; re-encode with: base64 -w0 /tmp/opencode/notive-actions-deploy"; exit 1; fi
          ssh-keygen -y -f ~/.ssh/notive > /tmp/pub_from_secret && echo "key parses OK, fingerprint:" && ssh-keygen -lf /tmp/pub_from_secret
          ssh-keyscan -H 87.232.225.109 2>/dev/null | tee ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts || { echo "ERROR: ssh-keyscan got nothing — VPS unreachable from runner"; exit 1; }
          cat >> ~/.ssh/config <<'EOF'
          Host notive-vps
            HostName 87.232.225.109
            User notive
            IdentityFile ~/.ssh/notive
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF

      - name: Rsync code to VPS
        run: |
          rsync -az --delete \
            --exclude .git/ --exclude .github/ \
            --exclude .env --exclude certs/ --exclude notive.key \
            --exclude wheels/ --exclude base64.err \
            --exclude '__pycache__/' --exclude '*.pyc' \
            ./ notive-vps:/opt/notive/
          ls notive-vps:/opt/notive/wheels >/dev/null && echo "wheelhouse present on VPS"

      - name: Build image and restart app
        run: |
          ssh notive-vps 'set -e; set -o pipefail
            cd /opt/notive
            podman build -t notive_app:latest --pull=false . 2>&1 | tail -2
            export XDG_RUNTIME_DIR=/run/user/$(id -u)
            systemctl --user restart notive-app.service
            sleep 8
            STATUS=$(curl -sk -o /dev/null -w "%{http_code}" --max-time 10 https://127.0.0.1:5001/)
            echo "healthcheck: $STATUS"
            [ "$STATUS" = "200" ] || { echo "--- app logs on failure ---"; podman logs --tail 50 notive-app 2>&1 || true; exit 1; }
          '
